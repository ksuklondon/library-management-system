version: '3.9'

services:
  # === PostgreSQL Database ===
  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: biblioteka
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend-network

  # === Auth Service ===
  auth-service:
    build:
      context: ./backend/auth-service
    container_name: auth-service
    depends_on:
      - postgres
    ports:
      - "8001:8001"
    networks:
      - backend-network
    environment:
      DATABASE_URL: postgres://admin:admin123@postgres:5432/biblioteka

  # === Catalog Service ===
  catalog-service:
    build:
      context: ./backend/catalog-service
    container_name: catalog-service
    depends_on:
      - postgres
    ports:
      - "8002:8002"
    networks:
      - backend-network
    environment:
      DATABASE_URL: postgres://admin:admin123@postgres:5432/biblioteka

  # === Loan Service ===
  loan-service:
    build:
      context: ./backend/loan-service
    container_name: loan-service
    depends_on:
      - postgres
    ports:
      - "8003:8003"
    networks:
      - backend-network
    environment:
      DATABASE_URL: postgres://admin:admin123@postgres:5432/biblioteka

  # === Frontend (Vite + NGINX) ===
  frontend:
    build:
      context: ./frontend
    container_name: frontend
    depends_on:
      - auth-service
      - catalog-service
      - loan-service
    ports:
      - "3000:80"  # przeglądarka:kontener
    networks:
      - backend-network

volumes:
  postgres-data:

networks:
  backend-network:
    driver: bridge
