services:
  # === PostgreSQL Database ===
  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: biblioteka
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d biblioteka"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === Auth Service ===
  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8001"
    networks:
      - backend-network
    env_file:
      - ./backend/auth-service/.env
    restart: unless-stopped

  # === Catalog Service ===
  catalog-service:
    build:
      context: ./backend
      dockerfile: catalog-service/Dockerfile
    container_name: catalog-service
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8002:8002"
    networks:
      - backend-network
    env_file:
      - ./backend/catalog-service/.env
    restart: unless-stopped

  # === Loan Service ===
  loan-service:
    build:
      context: ./backend
      dockerfile: loan-service/Dockerfile
    container_name: loan-service
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8003:8003"
    networks:
      - backend-network
    env_file:
      - ./backend/loan-service/.env
    restart: unless-stopped

  # === Frontend (Vite + NGINX) ===
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # ⭐ DODAJ TO - przekazuje URL-e podczas budowania
        - VITE_AUTH_API_URL=http://auth-service:8001
        - VITE_CATALOG_API_URL=http://catalog-service:8002
        - VITE_LOAN_API_URL=http://loan-service:8003
    container_name: frontend
    depends_on:
      - auth-service
      - catalog-service
      - loan-service
    ports:
      - "3000:80"
    networks:
      - backend-network
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  backend-network:
    driver: bridge
