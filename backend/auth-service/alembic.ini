# Konfiguracja Alembic – narzędzie do migracji bazy danych SQLAlchemy

[alembic]
# Katalog, w którym trzymane są skrypty migracji
script_location = alembic

# Szablon nazwy plików migracji (data + czas + numer rewizji + slug)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Strefa czasowa używana w migracjach
timezone = UTC

# Maksymalna długość "slug" w nazwie pliku migracji
truncate_slug_length = 40

# Separator ścieżek dla wersji (os = zgodnie z systemem operacyjnym)
version_path_separator = os

# Kodowanie plików migracji
output_encoding = utf-8

# Domyślne połączenie z bazą danych dla Alembica
# Używane przy generowaniu i wykonywaniu migracji
sqlalchemy.url = postgresql://admin:admin123@localhost:5432/biblioteka

[post_write_hooks]
# Sekcja z hookami uruchamianymi po wygenerowaniu pliku migracji (tu pusta)

[loggers]
# Lista loggerów używanych przez Alembic i SQLAlchemy
keys = root,sqlalchemy,alembic

[handlers]
# Zdefiniowane handlery logów
keys = console

[formatters]
# Zdefiniowane formatery logów
keys = generic

[logger_root]
# Główny logger (root)
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
# Logger dla SQLAlchemy (zapytania SQL itd.)
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
# Logger dla Alembica (informacje o migracjach)
level = INFO
handlers =
qualname = alembic

[handler_console]
# Handler wypisujący logi na stderr (konsola)
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
# Domyślny format logów
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
