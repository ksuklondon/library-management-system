# Alembic configuration file for Loan Service migrations.
#
# Wymaganie: NF8 - Migracje bazy danych
# Ten plik steruje działaniem Alembic — narzędzia odpowiedzialnego
# za generowanie i wykonywanie migracji schematu bazy danych.
# Określa m.in.:
# - gdzie znajdują się skrypty migracji,
# - jak mają wyglądać nazwy plików migracji,
# - ustawienia logowania,
# - domyślne połączenie z bazą (nadpisywane w env.py).


[alembic]
# Lokalizacja katalogu ze skryptami migracji (folder /alembic).
# To tutaj Alembic tworzy nowe pliki migracji i szuka istniejących.
script_location = alembic

# Format nazw plików migracji.
# Zawiera datę, godzinę, ID rewizji i slug wygenerowany z opisu migracji.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Dodaj bieżący katalog do sys.path (ułatwia importy w migracjach).
prepend_sys_path = .

# Separator ścieżek dla wielu lokalizacji wersji.
# 'os' oznacza użycie os.pathsep (np. ":" lub ";").
version_path_separator = os  # domyślne zachowanie Alembic

# Domyślne kodowanie w generowanych plikach migracji.
# Pozostawione jako domyślne, UTF-8.
# output_encoding = utf-8

# Domyślny URL bazy danych dla migracji.
# Uwaga: env.py *nadpisuje* tę wartość zmienną środowiskową DATABASE_URL
# — ta linia służy głównie jako fallback.
sqlalchemy.url = postgresql://loan_user:loan_password@localhost:5432/loan_db


[post_write_hooks]
# Sekcja odpowiedzialna za akcje po wygenerowaniu migracji
# (np. formatowanie kodu Black/Ruff).
# W projekcie nie są one używane — pozostawione jako komentarze.


[loggers]
# Konfiguracja loggerów Alembic i SQLAlchemy.
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
# Poziom logowania root — ostrzeżenia i wyżej.
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
# Logi silnika SQLAlchemy — ostrzeżenia i błędy.
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
# Logi Alembic — poziom INFO, aby widzieć szczegóły migracji.
level = INFO
handlers =
qualname = alembic

[handler_console]
# Logowanie do konsoli (stderr).
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
# Format logów wypisywanych w konsoli.
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
